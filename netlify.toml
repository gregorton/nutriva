# Netlify build for Slim Wellness Asia.
#
# The site is not a static export: /c/[slug], /search, /signin, /signup, /account/* and the route
# handlers all render at request time. Netlify's framework detection sees Next.js and applies the
# current OpenNext adapter itself — so this file deliberately declares no [[plugins]] block and no
# publish directory. Naming @netlify/plugin-nextjs here pins the adapter and opts the site out of
# updates, which is the one thing Netlify's docs tell you not to do.
#
# Environment variables go in Site configuration → Environment variables, not here. DATABASE_URL is
# the only one the site needs; with it unset the storefront still builds and serves, and accounts,
# reviews and saved items switch themselves off (see lib/db.ts). GOOGLE_* and FACEBOOK_* are
# optional, and a provider whose pair is blank shows no button.
#
# Set OAUTH_REDIRECT_ORIGIN to the deployed origin (e.g. https://slimwellnessasia.netlify.app) and
# register <origin>/api/auth/google/callback and /api/auth/facebook/callback with each provider, or
# the consent screen refuses the redirect.

[build]
  command = "npm run build"

[build.environment]
  # Next 16 needs 20.9+; 22 is the current LTS.
  NODE_VERSION = "22"
